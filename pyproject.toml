[project]
name = "portkeeper"
version = "0.1.0"
description = "CLI pour lister, vérifier et libérer les ports réseau utilisés localement."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "DevPortKeeper" }]
dependencies = [
    "typer>=0.12,<1.0",
    "rich>=13.0,<14.0",
    "psutil>=5.9,<7.0",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: POSIX :: Linux",
    "Topic :: System :: Networking",
]

[project.scripts]
portkeeper = "portkeeper.cli:app"

[tool.poetry]
packages = [{ include = "portkeeper", from = "src" }]

[tool.poetry.group.dev.dependencies]
pytest = ">=8.0,<9.0"
ruff = ">=0.6,<1.0"

[build-system]
requires = ["poetry-core>=2.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM", "N"]

[tool.ruff.lint.per-file-ignores]
"src/portkeeper/cli.py" = ["B008"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --tb=short"
pythonpath = ["src"]